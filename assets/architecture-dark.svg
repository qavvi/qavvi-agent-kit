<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" rx="24" fill="#172019"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="59" font-size="25" font-weight="700" fill="#edf5e5">From your agent to a supported service.</text><text x="48" y="91" font-size="16" fill="#b1bda6">Local tools. A hosted gateway. Explicit payment authorization.</text><path d="M268 208h64" stroke="#4a6041" stroke-width="3"/><circle cx="300" cy="208" r="5" fill="#91ad60"/><path d="M548 208h64" stroke="#4a6041" stroke-width="3"/><circle cx="580" cy="208" r="5" fill="#91ad60"/><path d="M828 208h64" stroke="#4a6041" stroke-width="3"/><circle cx="860" cy="208" r="5" fill="#91ad60"/><rect x="48" y="139" width="220" height="138" rx="20" fill="#243126" stroke="#4a6041"/><text x="68" y="171" font-size="14" fill="#b1bda6">01</text><text x="68" y="212" font-size="21" font-weight="700" fill="#edf5e5">Your agent</text><text x="68" y="244" font-size="15" fill="#b1bda6">MCP client or CLI</text><rect x="328" y="139" width="220" height="138" rx="20" fill="#243126" stroke="#4a6041"/><text x="348" y="171" font-size="14" fill="#b1bda6">02</text><text x="348" y="212" font-size="21" font-weight="700" fill="#edf5e5">Qavvi Agent Kit</text><text x="348" y="244" font-size="15" fill="#b1bda6">Local stdio bridge</text><rect x="608" y="139" width="220" height="138" rx="20" fill="#243126" stroke="#4a6041"/><text x="628" y="171" font-size="14" fill="#b1bda6">03</text><text x="628" y="212" font-size="21" font-weight="700" fill="#edf5e5">Qavvi gateway</text><text x="628" y="244" font-size="15" fill="#b1bda6">Quotes and execution</text><rect x="888" y="139" width="220" height="138" rx="20" fill="#243126" stroke="#4a6041"/><text x="908" y="171" font-size="14" fill="#b1bda6">04</text><text x="908" y="212" font-size="21" font-weight="700" fill="#edf5e5">Service provider</text><text x="908" y="244" font-size="15" fill="#b1bda6">Supported endpoint</text><path d="M998 289v30H158v-30" fill="none" stroke="#4a6041" stroke-width="2" stroke-dasharray="5 7"/><rect x="383" y="303" width="390" height="32" rx="16" fill="#172019"/><text x="578" y="325" text-anchor="middle" font-size="15" fill="#b1bda6">Result or payment requirements returned to your client</text><text x="48" y="393" font-size="16" fill="#edf5e5">The kit does not automatically sign payments or spend wallet funds.</text></g></svg>